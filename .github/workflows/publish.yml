name: Build & Publish Site

on:
  # Manual trigger (Actions tab se "Run workflow" button)
  workflow_dispatch:

  # Scheduled trigger — har 10 minute me chalega
  # Firebase me naye products/updates aane pe automatic rebuild
  schedule:
    - cron: '*/10 * * * *'

  # Push trigger — koi bhi file change karo to automatic chalega
  push:
    branches: [ main ]
    # NOTE: No `paths` filter — every push triggers the build

# Permissions needed for the workflow
permissions:
  contents: write       # To commit generated files
  pages: write          # To deploy to GitHub Pages
  id-token: write       # For OIDC deployment

# Prevent parallel runs — queue them
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────────
      # 1. Checkout repository
      # ─────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ─────────────────────────────────────────────
      # 2. Setup Node.js
      # ─────────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ─────────────────────────────────────────────
      # 3. Generate static pages from Firebase
      #    - Fetches products and updates
      #    - Generates /products/<slug>/ and /updates/<slug>/
      #    - Injects SSR into index.html
      #    - Regenerates sitemap.xml and rss.xml
      # ─────────────────────────────────────────────
      - name: Generate static pages
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: node scripts/build-site.mjs

      # ─────────────────────────────────────────────
      # 4. Commit and push generated files
      #    - Only commits if there are actual changes
      #    - Uses [skip ci] to avoid infinite loop
      # ─────────────────────────────────────────────
      - name: Commit generated files
        run: |
          git config user.name "zishu-bot"
          git config user.email "bot@zishutron.invalid"
          git add products updates sitemap.xml rss.xml index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: rebuild static pages [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi

      # ─────────────────────────────────────────────
      # 5. Deploy to GitHub Pages
      # ─────────────────────────────────────────────
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
